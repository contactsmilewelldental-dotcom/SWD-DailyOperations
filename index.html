<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smile Well Dental — Clinic Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F4F7F6;
    --surface:#FFFFFF;
    --surface-2:#EEF3F2;
    --ink:#16302C;
    --ink-soft:#4B635F;
    --line:#DCE6E3;
    --teal:#0E6E63;
    --teal-dark:#0A4C44;
    --teal-pale:#E3F1EE;
    --amber:#C98A1E;
    --amber-pale:#FBF0DC;
    --red:#B3413A;
    --red-pale:#F8E7E5;
    --chip:#0E6E63;
    --radius:10px;
    --shadow: 0 1px 2px rgba(16,45,40,0.06), 0 6px 20px rgba(16,45,40,0.05);
    --font-display:'Manrope',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--ink);}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  .hidden{display:none !important;}
  [hidden]{display:none !important;}

  /* ---------- Login ---------- */
  #loginScreen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 12% 18%, rgba(14,110,99,0.10), transparent 45%),
      radial-gradient(circle at 88% 82%, rgba(201,138,30,0.10), transparent 45%),
      var(--bg);
    padding:24px;
  }
  .login-card{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);width:100%;max-width:380px;padding:36px 32px;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .brand-mark{
    width:40px;height:40px;border-radius:9px;background:var(--teal);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-weight:800;font-size:16px;letter-spacing:-0.5px;flex-shrink:0;
  }
  .brand-logo{
    background:#fff;object-fit:contain;padding:3px;
  }
  .sidebar .brand-logo{background:#fff;}
  .brand-text h1{font-size:16px;letter-spacing:-0.2px;}
  .brand-text span{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
  .field select, .field input{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:14.5px;background:var(--surface-2);color:var(--ink);
  }
  .field select:focus, .field input:focus{outline:2px solid var(--teal);outline-offset:1px;background:#fff;}
  .btn{
    border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:14px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .05s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:transparent;color:var(--teal);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--teal-pale);}
  .btn-danger{background:var(--red-pale);color:var(--red);}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
  .login-error{color:var(--red);font-size:13px;margin-top:12px;text-align:center;}
  .login-hint{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:18px;line-height:1.5;}

  /* ---------- App shell ---------- */
  #app{display:none;min-height:100vh;grid-template-columns:230px 1fr;}
  #app.active{display:grid;}
  .sidebar{
    background:var(--teal-dark);color:#fff;padding:22px 16px;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .sidebar .brand{color:#fff;margin-bottom:28px;}
  .sidebar .brand-mark{background:#fff;color:var(--teal-dark);}
  .sidebar .brand-text span{color:rgba(255,255,255,0.6);}
  .sidebar .brand-text h1{color:#fff;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:rgba(255,255,255,0.78);
    font-size:14px;font-weight:600;cursor:pointer;margin-bottom:2px;
  }
  .nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.14);color:#fff;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;flex-shrink:0;}
  .sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.12);}
  .who{font-size:12.5px;color:rgba(255,255,255,0.7);margin-bottom:10px;}
  .who b{color:#fff;display:block;font-size:14px;font-family:var(--font-display);}

  .main{padding:28px 34px;max-width:1180px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h2{font-size:22px;letter-spacing:-0.3px;}
  .page-head p{margin:4px 0 0;color:var(--ink-soft);font-size:13.5px;}
  .eyebrow{font-size:11.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:0.09em;margin-bottom:4px;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
  .card h3{font-size:14.5px;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr;}}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);
     border-bottom:1px solid var(--line);padding:8px 10px;font-weight:700;}
  td{padding:10px;border-bottom:1px solid var(--line);color:var(--ink);}
  tr:last-child td{border-bottom:none;}
  tr.rowlink:hover{background:var(--surface-2);cursor:pointer;}

  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;}
  .pill-paid{background:var(--teal-pale);color:var(--teal-dark);}
  .pill-unpaid{background:var(--red-pale);color:var(--red);}
  .pill-partial{background:var(--amber-pale);color:var(--amber);}

  .id-chip{
    font-family:var(--font-mono);background:var(--teal-pale);color:var(--teal-dark);
    padding:3px 8px;border-radius:6px;font-size:12.5px;font-weight:600;letter-spacing:0.02em;
  }

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  @media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .stat .n{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--teal-dark);}
  .stat .l{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
  .toolbar input[type=text], .toolbar input[type=search]{
    padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--surface-2);min-width:200px;
  }

  .modal-bg{position:fixed;inset:0;background:rgba(16,45,40,0.35);display:none;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:50;}
  .modal-bg.active{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .close-x{background:none;border:none;font-size:20px;color:var(--ink-soft);padding:2px 6px;border-radius:6px;}
  .close-x:hover{background:var(--surface-2);}

  .empty{padding:36px 12px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
  .empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:15px;margin-bottom:4px;}

  .badge-role{font-size:10.5px;background:rgba(255,255,255,0.14);padding:2px 7px;border-radius:99px;color:#fff;margin-left:6px;}
  .field-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .tag-list{display:flex;flex-wrap:wrap;gap:8px;}
  .tag{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;}
  .tag button{background:none;border:none;color:var(--red);font-size:13px;padding:0;}
  .inline-add{display:flex;gap:8px;margin-top:10px;}
  .inline-add input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;}

  .installment-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}

  /* ---------- Print ---------- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:24px;}
  }
  .print-doc{font-family:var(--font-body);color:#111;}
  .print-doc h2{font-family:var(--font-display);font-size:20px;border-bottom:2px solid #0E6E63;padding-bottom:8px;margin-bottom:14px;}
  .print-doc table{margin-top:10px;}
  .print-doc td{padding:6px 4px;border:none;}
  .print-doc .lbl{color:#555;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;}
  .print-doc .val{font-size:14.5px;font-weight:600;}
  .print-foot{margin-top:26px;font-size:11.5px;color:#777;}

  /* ---------- Rx paper print (pre-printed letterhead, A4) ----------
     Only patient details are printed; positions are in pt measured from the
     top-left of the A4 sheet. Nudge --rx-dx / --rx-dy if your printer is off. */
  @page rx{size:A4;margin:0;}
  #printArea.rx{padding:0 !important;}
  .rx-sheet{page:rx;position:relative;width:210mm;height:297mm;overflow:hidden;
    --rx-dx:0pt;--rx-dy:0pt;font-family:Arial,Helvetica,sans-serif;color:#000;}
  .te{font-family:'Noto Sans Telugu','Gautami','Nirmala UI',sans-serif;}
  .rx-f{font-family:'Noto Sans Telugu','Gautami','Nirmala UI',var(--font-body);position:absolute;height:12pt;line-height:12pt;font-size:10pt;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:clip;
    margin-left:var(--rx-dx);margin-top:var(--rx-dy);}
  /* ---------- Sidebar toggle ---------- */
  #app.sb-hidden{grid-template-columns:1fr;}
  #app.sb-hidden .sidebar{display:none;}
  .sb-open-btn{display:none;position:fixed;top:12px;left:12px;z-index:40;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow);}
  .sb-open-btn:hover{background:var(--teal-dark);}
  #app.active.sb-hidden ~ .sb-open-btn{display:block;}
  #app.sb-hidden .main{padding-top:64px;}
  @media print{.sb-open-btn{display:none !important;}}
  /* ---------- Dashboard charts ---------- */
  .chart-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .chart-head h3{margin:0;}
  .chart-head select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink);}
  .bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding:18px 4px 0;border-bottom:1px solid var(--line);overflow-x:auto;}
  .bar-col{flex:1;min-width:34px;max-width:90px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;}
  .bar-val{font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .bar{width:100%;border-radius:6px 6px 0 0;background:var(--teal);min-height:2px;transition:height .25s ease;}
  .bar.dim{background:#9CC9C2;}
  .bar.zero{background:var(--line);}
  .bar-labels{display:flex;gap:10px;padding:6px 4px 0;overflow-x:auto;}
  .bar-labels span{flex:1;min-width:34px;max-width:90px;text-align:center;font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .bar.blue{background:#3B6FB6;} .bar.blue.dim{background:#A9C0E3;}
  .bar.gold{background:#C98A1E;} .bar.gold.dim{background:#E6C98F;}
  .bar.blue.zero,.bar.gold.zero{background:var(--line);}
  .chart-pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:1000px){.chart-pair{grid-template-columns:1fr;}}
  .btn-xl{background:#3B6FB6;color:#fff;}
  .btn-xl:hover{background:#2D5791;}
  .log-row{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .log-row:last-child{border-bottom:none;}
  .log-when{color:var(--ink-soft);}
  .chart-note{font-size:12px;color:var(--ink-soft);margin-top:10px;}
</style>
</head>

<script>
/* ===================== DATA LAYER (Google Sheets backend + local cache) ===================== */
const CACHE_KEY = 'clinicops_cache_v1';
const SERVER_KEY = 'clinicops_server_url';

function defaultData(){
  return {
    users:{
      admin:{password:'1234'},
      receptionist:{password:'1234'},
      doctor1:{name:'Doctor 1', password:'1234'},
      doctor2:{name:'Doctor 2', password:'1234'},
      doctor3:{name:'Doctor 3', password:'1234'},
    },
    settings:{ opFee:150, clinicName:'Smile Well Dental' },
    villages:['Village A','Village B','Village C'],
    treatments:['General Consultation','Follow-up','Minor Procedure','Physiotherapy'],
    patients:[],
    idCounter:0
  };
}

function getCache(){ const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; }
function setCache(d){ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }

let DATA = getCache() || defaultData();
let SESSION = JSON.parse(sessionStorage.getItem('clinicops_session') || 'null');
const DEFAULT_SERVER_URL = 'https://script.google.com/macros/s/AKfycbyHBz21nn2tDhWfuXwitcsFtNaFWl-4dkypLeC-NzeJY0SaBL0cldxqq6xOQIyMy6pG/exec';
const REVIEW_URL = 'https://g.page/r/CWtBljjaLVhKEBM/review';
/* To change the Google Sheet link, edit DEFAULT_SERVER_URL above. */
const LEGACY_SHEET_URL = DEFAULT_SERVER_URL;
let SERVER_URL = DEFAULT_SERVER_URL;
let SYNC_STATE = SERVER_URL ? 'syncing' : 'local'; // connected | syncing | offline | error | local
let SYNC_MSG = '';
/* ===================== FIREBASE ===================== */
/* Paste your Firebase web-app config here (Firebase console → Project settings → Your apps → Web app). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB4OEZEAEGo4F2QB_zSTq5AfXQnpkUCgoU",
  authDomain: "swd-dailyoperations.firebaseapp.com",
  projectId: "swd-dailyoperations",
  storageBucket: "swd-dailyoperations.firebasestorage.app",
  messagingSenderId: "795060232123",
  appId: "1:795060232123:web:1aa3b367e6ad7c73ec6e9e"
};
const FB_EMAIL_DOMAIN = 'smilewell.dental';   // staff logins are admin@smilewell.dental, doctor1@smilewell.dental ...
const FB_ON = !!(window.firebase && FIREBASE_CONFIG.apiKey && !/^PASTE/.test(FIREBASE_CONFIG.apiKey));
let fbAuth = null, fbDb = null, FB_SAVED = {}, FB_QUEUE = Promise.resolve(), FB_UNSUBS = [];
if(FB_ON){ firebase.initializeApp(FIREBASE_CONFIG); fbAuth = firebase.auth(); fbDb = firebase.firestore(); }
const clone = o => JSON.parse(JSON.stringify(o));

if(FB_ON){ SERVER_URL = ''; SYNC_STATE = 'syncing'; }
function fbConfigDoc(){
  const users = {};
  Object.keys(DATA.users||{}).forEach(k=>{ users[k] = DATA.users[k].name ? {name:DATA.users[k].name} : {}; });
  return clone({ users, settings:DATA.settings||{}, villages:DATA.villages||[], treatments:DATA.treatments||[], idCounter:DATA.idCounter||0 });
}
function fbApplyConfig(c){
  const base = defaultData();
  Object.keys(base.users).forEach(k=>{
    const name = c.users && c.users[k] && c.users[k].name;
    DATA.users[k] = Object.assign({}, DATA.users[k]||{}, name ? {name} : {});
    delete DATA.users[k].password;
  });
  if(c.settings) DATA.settings = c.settings;
  if(c.villages) DATA.villages = c.villages;
  if(c.treatments) DATA.treatments = c.treatments;
  if(typeof c.idCounter==='number') DATA.idCounter = Math.max(DATA.idCounter||0, c.idCounter);
}
async function fbLoadAll(){
  const base = defaultData();
  Object.keys(base.users).forEach(k=>delete base.users[k].password);
  DATA = base;
  const cfg = await fbDb.collection('clinic').doc('config').get();
  if(cfg.exists){ fbApplyConfig(cfg.data()); FB_SAVED = { __config: JSON.stringify(fbConfigDoc()) }; }
  else { FB_SAVED = { __config: '' }; }   // first run: config is created on first save
  const snap = await fbDb.collection('patients').get();
  DATA.patients = snap.docs.map(d=>d.data());
  DATA.patients.forEach(p=>{ FB_SAVED[p.id] = JSON.stringify(p); });
  // keep idCounter ahead of any existing patient number
  DATA.patients.forEach(p=>{ const n = parseInt(String(p.id).replace(/\D/g,''),10); if(n>(DATA.idCounter||0)) DATA.idCounter = n; });
  setCache(DATA);
  SYNC_STATE = 'connected'; SYNC_MSG = 'Synced ' + new Date().toLocaleTimeString();
}
/* Only changed patients (and settings) are written, so two devices rarely overwrite each other. */
function fbPush(){
  FB_QUEUE = FB_QUEUE.then(async()=>{
    const ops = [];
    const cfgJson = JSON.stringify(fbConfigDoc());
    if(cfgJson !== FB_SAVED.__config) ops.push({ref:fbDb.collection('clinic').doc('config'), json:cfgJson, key:'__config'});
    DATA.patients.forEach(p=>{
      const j = JSON.stringify(p);
      if(FB_SAVED[p.id] !== j) ops.push({ref:fbDb.collection('patients').doc(String(p.id)), json:j, key:p.id});
    });
    if(!ops.length) return;
    SYNC_STATE = 'syncing'; updateSyncBadge();
    for(let i=0;i<ops.length;i+=400){
      const chunk = ops.slice(i,i+400), batch = fbDb.batch();
      chunk.forEach(o=>batch.set(o.ref, JSON.parse(o.json)));
      await batch.commit();
      chunk.forEach(o=>{ FB_SAVED[o.key] = o.json; });
    }
    SYNC_STATE = 'connected'; SYNC_MSG = 'Synced ' + new Date().toLocaleTimeString(); updateSyncBadge();
  }).catch(err=>{
    console.error(err);
    SYNC_STATE = 'error'; SYNC_MSG = 'Saved on this device only — Firebase save failed (' + (err.code||err.message) + ')';
    updateSyncBadge();
  });
  return FB_QUEUE;
}
function fbUnlisten(){ FB_UNSUBS.forEach(u=>{ try{u();}catch(e){} }); FB_UNSUBS = []; }
function fbAutoRender(){
  const modalOpen = document.getElementById('modalBg').classList.contains('active');
  const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(!modalOpen && !typing && SESSION) render();
}
/* Live updates: a patient added on another device appears here without pressing Sync. */
function fbListen(){
  fbUnlisten();
  FB_UNSUBS.push(fbDb.collection('patients').onSnapshot(snap=>{
    let changed = false;
    snap.docChanges().forEach(ch=>{
      if(ch.doc.metadata.hasPendingWrites) return;
      const p = ch.doc.data(), j = JSON.stringify(p), i = DATA.patients.findIndex(x=>x.id===p.id);
      if(ch.type==='removed'){ if(i>=0) DATA.patients.splice(i,1); delete FB_SAVED[p.id]; changed = true; return; }
      if(FB_SAVED[p.id] === j) return;
      if(i>=0){ const o = DATA.patients[i]; Object.keys(o).forEach(k=>delete o[k]); Object.assign(o,p); } else DATA.patients.push(p);
      FB_SAVED[p.id] = j; changed = true;
    });
    if(changed){ setCache(DATA); fbAutoRender(); }
  }, err=>console.warn('patients listener', err)));
  FB_UNSUBS.push(fbDb.collection('clinic').doc('config').onSnapshot(d=>{
    if(!d.exists || d.metadata.hasPendingWrites) return;
    fbApplyConfig(d.data());
    const j = JSON.stringify(fbConfigDoc());
    if(j !== FB_SAVED.__config){ FB_SAVED.__config = j; setCache(DATA); fbAutoRender(); }
  }, err=>console.warn('config listener', err)));
}
async function fbStart(expectedRole){
  const user = fbAuth.currentUser;
  const st = await fbDb.collection('staff').doc(user.uid).get();
  if(!st.exists || !(st.data().role in {admin:1,receptionist:1,doctor1:1,doctor2:1,doctor3:1})){
    await fbAuth.signOut(); const e = new Error('no-staff'); e.code = 'no-staff'; throw e;
  }
  const role = String(st.data().role||'').trim().toLowerCase();
  if(expectedRole && role !== expectedRole){ const uidShown = user.uid, emailShown = user.email; await fbAuth.signOut(); const e = new Error('wrong-role'); e.code = 'wrong-role'; e.detail = ' You signed in as ' + emailShown + ' (UID ' + uidShown + '), whose staff record says role "' + st.data().role + '", but you selected "' + expectedRole + '".'; throw e; }
  await fbLoadAll();
  fbListen();
  const u = DATA.users[role] || {};
  SESSION = { role, name: u.name || (role==='admin'?'Admin':role==='receptionist'?'Receptionist':role) };
  sessionStorage.setItem('clinicops_session', JSON.stringify(SESSION));
  boot();
}

function openChangePassword(){

  openModal(`

    <div class="field"><label>New password</label><input type="password" id="cpNew" autocomplete="new-password" placeholder="At least 6 characters"></div>
    <div class="field"><label>Confirm new password</label><input type="password" id="cpNew2" autocomplete="new-password"></div>
    <div id="cpMsg" class="field-note" style="margin-bottom:10px;"></div>
    <div style="display:flex;gap:10px;"><button class="btn btn-primary" id="cpBtn" onclick="doChangePassword()">Update password</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div>
  `);
  setTimeout(()=>{ const c=document.getElementById('cpCur'); if(c) c.focus(); }, 50);

async function doChangePassword(){
  const cur = document.getElementById('cpCur').value;
  const n1 = document.getElementById('cpNew').value;
  const n2 = document.getElementById('cpNew2').value;
  const msg = document.getElementById('cpMsg'), btn = document.getElementById('cpBtn');
  const fail = t=>{ msg.style.color = '#b42318'; msg.textContent = t; };
  msg.textContent = '';
  if(!cur || !n1 || !n2) return fail('Please fill in all three fields.');
  if(n1.length < 6) return fail('New password must be at least 6 characters.');
  if(n1 !== n2) return fail('The new passwords do not match.');
  if(n1 === cur) return fail('The new password must be different from the current one.');
  const user = fbAuth.currentUser;
  if(!user) return fail('You are signed out. Please sign in again.');
  btn.disabled = true; msg.style.color = ''; msg.textContent = 'Updating…';
  try{
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(n1);
    msg.style.color = '#067647'; msg.textContent = 'Password updated. Use the new password next time you sign in.';
    setTimeout(closeModal, 1800);
  }catch(e){
    btn.disabled = false;
    if(['auth/wrong-password','auth/invalid-credential'].includes(e.code)) fail('Current password is incorrect.');
    else if(e.code==='auth/weak-password') fail('New password is too weak. Use at least 6 characters.');
    else if(e.code==='auth/too-many-requests') fail('Too many attempts. Wait a few minutes and try again.');
    else if(e.code==='auth/requires-recent-login') fail('Please sign out, sign in again, and then change the password.');
    else fail('Could not change password (' + (e.code||e.message) + ').');
  }
}
/* One-time copy of the old Google Sheet data into Firebase (admin only, from Villages, Fee & Treatments). */
async function importFromSheet(){
  if(!confirm('Copy all patients and settings from the old Google Sheet into Firebase? Patients with the same ID will be overwritten.')) return;
  try{
    const res = await fetch(LEGACY_SHEET_URL), remote = await res.json();
    if(!(remote && remote.ok && remote.data)) throw new Error('The Sheet sent no data.');
    const r = remote.data;
    if(r.settings) DATA.settings = r.settings;
    if(r.villages) DATA.villages = r.villages;
    if(r.treatments) DATA.treatments = r.treatments;
    DATA.idCounter = Math.max(DATA.idCounter||0, r.idCounter||0);
    Object.keys(r.users||{}).forEach(k=>{ if(DATA.users[k] && r.users[k].name) DATA.users[k].name = r.users[k].name; });
    DATA.patients = r.patients || [];
    FB_SAVED = {};            // forces everything to be written
    setCache(DATA);
    await fbPush();
    alert('Imported ' + DATA.patients.length + ' patients into Firebase.');
    render();
  }catch(e){ alert('Import failed: ' + (e.message||e)); }
}


/* Pull the latest data down from the connected Google Sheet. Falls back to cache on failure. */
async function initData(){
  if(!SERVER_URL){ SYNC_STATE='local'; updateSyncBadge(); return; }
  SYNC_STATE = 'syncing'; updateSyncBadge();
  try{
    const res = await fetch(SERVER_URL, { method:'GET' });
    const remote = await res.json();
    if(remote && remote.ok && remote.data){
      const hasUsers = remote.data.users && Object.keys(remote.data.users).length > 0;
      if(!hasUsers){
        // Brand new, empty Sheet — seed it with the default accounts/settings.
        DATA = defaultData();
        setCache(DATA);
        await fetch(SERVER_URL, {
          method:'POST',
          headers:{ 'Content-Type':'text/plain;charset=utf-8' },
          body: JSON.stringify({ data: DATA })
        });
        SYNC_STATE = 'connected';
        SYNC_MSG = 'Sheet initialized with default accounts.';
      } else {
        DATA = remote.data;
        setCache(DATA);
        SYNC_STATE = 'connected';
        SYNC_MSG = 'Synced ' + new Date().toLocaleTimeString();
      }
    } else {
      SYNC_STATE = getCache() ? 'offline' : 'error';
      SYNC_MSG = 'Sheet responded but sent no data.';
    }
  }catch(err){
    SYNC_STATE = getCache() ? 'offline' : 'error';
    SYNC_MSG = 'Could not reach the Google Sheet.';
  }
  updateSyncBadge();
}

/* Save locally right away, then push the full dataset up to the Sheet in the background. */
function saveData(){
  setCache(DATA);
  if(FB_ON){ if(SESSION) fbPush(); return; }
  pushToServer();
}
function pushToServer(){
  if(!SERVER_URL){ SYNC_STATE='local'; updateSyncBadge(); return; }
  SYNC_STATE = 'syncing'; updateSyncBadge();
  fetch(SERVER_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ data: DATA })
  }).then(r=>r.json()).then(res=>{
    if(res && res.ok){ SYNC_STATE='connected'; SYNC_MSG='Synced ' + new Date().toLocaleTimeString(); }
    else{ SYNC_STATE='error'; SYNC_MSG='Sheet did not confirm the save — saved locally.'; }
    updateSyncBadge();
  }).catch(()=>{
    SYNC_STATE='error'; SYNC_MSG='Saved locally — could not reach the Sheet.';
    updateSyncBadge();
  });
}
function updateSyncBadge(){
  const el = document.getElementById('syncBadge');
  const map = {
    connected:{c:'#57D9C4', t:FB_ON?'Synced to Firebase':'Synced to Sheet'},
    syncing:{c:'#E8C46B', t:'Syncing…'},
    offline:{c:'#E8C46B', t:'Offline — last synced copy'},
    error:{c:'#F0938C', t:'Sync error — saved locally'},
    local:{c:'rgba(255,255,255,0.5)', t:FB_ON?'Not connected':'No Sheet connected'}
  };
  const s = map[SYNC_STATE] || map.local;
  if(el) el.innerHTML = `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${s.c};margin-right:6px;"></span>${s.t}`;
  const el2 = document.getElementById('syncBadgeSettings');
  if(el2) el2.innerHTML = `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${s.c==='rgba(255,255,255,0.5)'?'#8aa19c':s.c};margin-right:6px;"></span>${s.t}${SYNC_MSG?' · '+SYNC_MSG:''}`;
}
async function connectServer(){
  const url = document.getElementById('serverUrlInput').value.trim();
  if(!url){ alert('Paste the Web App URL from Apps Script first.'); return; }
  localStorage.setItem(SERVER_KEY, url);
  SERVER_URL = url;
  await initData();
  render();
}
function disconnectServer(){
  if(!confirm('Disconnect this device from the Google Sheet? Data already saved locally will stay on this device.')) return;
  localStorage.setItem(SERVER_KEY, '');
  SERVER_URL = '';
  SYNC_STATE = 'local';
  updateSyncBadge();
  render();
}
async function manualSync(){
  if(FB_ON){ try{ await fbLoadAll(); }catch(e){ SYNC_STATE='error'; SYNC_MSG='Could not reach Firebase.'; } render(); return; }
  if(!SERVER_URL){ alert('No Google Sheet connected yet. Go to Admin → Cloud Sync.'); return; }
  await initData();
  render();
}

function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function money(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
function paidSoFar(p){ return (p.payments||[]).reduce((s,x)=>s+Number(x.amount||0),0); }
function balanceOf(p){ const fee = Number(p.fee||0); return Math.max(fee - paidSoFar(p), 0); }

  if(bal<=0) return `<span class="pill pill-paid">Fully paid</span>`;
  if(paidSoFar(p)>0) return `<span class="pill pill-partial">Partial</span>`;
  return `<span class="pill pill-unpaid">Unpaid</span>`;
}

function dayStr(off){ const d=new Date(); d.setDate(d.getDate()+off); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function waNumber(c){
  let d = String(c||'').replace(/\D/g,'');
  const cc = String((DATA.settings&&DATA.settings.countryCode)||'91').replace(/\D/g,'');
  if(d.length===10) d = cc+d;
  else if(d.length===11 && d[0]==='0') d = cc+d.slice(1);
  return d.length>=11 ? d : '';
}
function waMsg(p, kind){
  const clinic = (DATA.settings&&DATA.settings.clinicName) || 'our clinic';
  const reviewUrl = (DATA.settings&&DATA.settings.reviewUrl) || REVIEW_URL;
  const paid = paidSoFar(p), bal = balanceOf(p), fee = Number(p.fee||0);
  const doc = DATA.users[p.doctor] ? DATA.users[p.doctor].name : 'the doctor';
  if(kind==='paid'){
    const last = (p.payments||[]).slice(-1)[0];
    return `Hello ${p.name}, `+(last ? `we have received your payment of ${money(last.amount)} on ${fmtDate(last.date)} at ${clinic}.` : `this is a billing update from ${clinic}.`)+`\nTotal fee: ${money(fee)}\nPaid so far: ${money(paid)}\nBalance: ${money(bal)}\nThank you!`;
  }
  if(kind==='balance'){
    return `Hello ${p.name}, this is a gentle reminder from ${clinic}.\nYour balance amount is ${money(bal)} (total fee ${money(fee)}, paid ${money(paid)}).\nPlease clear it at your next visit. Thank you.`;
  }
  if(kind==='appt'){
    if(!p.nextVisit) return `Hello ${p.name}, this is a reminder from ${clinic}. Please call us to confirm your next appointment.`;
    const when = p.nextVisit===dayStr(1) ? `tomorrow, ${fmtDate(p.nextVisit)}` : `on ${fmtDate(p.nextVisit)}`;
    return `Hello ${p.name}, this is a reminder from ${clinic}.\nYour appointment with ${doc} is ${when}.\nPlease arrive a few minutes early. Reply to this message if you need to reschedule.`;
  }
  return `Hello ${p.name}, thank you for visiting ${clinic}. We would be grateful if you could share your experience with a Google review:\n${reviewUrl}\nThank you for your support!`;
}

  document.getElementById('mainArea').innerHTML = `
    <div class="page-head">
      <div><div class="eyebrow">Front desk</div><h2>New Patient Entry</h2><p>Fields marked * are required.</p></div>
    </div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label>Date of entry *</label><input type="date" id="fDate" value="${todayStr()}"></div>
        <div class="field"><label>Name in English *</label><input type="text" id="fName" placeholder="Patient's full name"></div>
        <div class="field"><label>Name in Telugu * (తెలుగు పేరు)</label><input type="text" id="fNameTe" class="te" lang="te" placeholder="తెలుగులో పేరు"><div class="field-note">Name is required — enter it in English or Telugu (either one is enough, or both).</div></div>
        <div class="field"><label>Age *</label><input type="number" id="fAge" min="0" placeholder="e.g. 34"></div>
        <div class="field"><label>Gender *</label>
          <select id="fGender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
        </div>
        <div class="field"><label>Address (village)</label>
          <select id="fVillage"><option value="">Select village</option>${villageOpts}</select>
        </div>
        <div class="field"><label>Contact no.</label><input type="tel" id="fContact" placeholder="10-digit number"></div>
        <div class="field"><label>OP fee</label><input type="number" id="fOpFee" value="${DATA.settings.opFee}"></div>
        <div class="field"><label>Status</label>
          <select id="fStatus"><option value="Unpaid">Unpaid</option><option value="Paid">Paid</option></select>
        </div>
        <div class="field"><label>Allocated doctor *</label>
          <select id="fDoctor"><option value="">Select doctor</option>${doctorOpts}</select>
        </div>
      </div>
      <button class="btn btn-primary" onclick="submitPatient()">Save & generate ID</button>
    </div>
    <div class="card">
      <h3>Recently added</h3>
      <div id="recentList"></div>
    </div>
  `;
  renderRecentList();
};

function renderRecentList(){
  const recent = [...DATA.patients].sort((a,b)=> b.createdAt-a.createdAt).slice(0,8);
  const el = document.getElementById('recentList');
  if(!recent.length){ el.innerHTML = `<div class="empty"><b>No patients yet</b>New entries will appear here.</div>`; return; }
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Name</th><th>Date</th><th>Doctor</th><th>OP Fee</th><th></th></tr></thead><tbody>
    ${recent.map(p=>`<tr>
      <td><span class="id-chip">${p.id}</span></td>
      <td>${p.name}${teName(p)}</td><td>${fmtDate(p.date)}</td>
      <td>${DATA.users[p.doctor]?DATA.users[p.doctor].name:'—'}</td>
      <td>${money(p.opFee)} ${opStatusPill(p.status)}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="printEntryForm('${p.id}')">Print</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}

function submitPatient(){
  const nameEn = document.getElementById('fName').value.trim();
  const nameTeIn = document.getElementById('fNameTe').value.trim();
  const name = nameEn || nameTeIn;
  const age = document.getElementById('fAge').value;
  const gender = document.getElementById('fGender').value;
  const doctor = document.getElementById('fDoctor').value;
  const date = document.getElementById('fDate').value;
  if(!name || !age || !gender || !doctor || !date){
    alert('Please fill all required fields (Date, Name in English or Telugu, Age, Gender, Allocated doctor).');
    return;
  }
  const p = {
    id: genPatientId(),
    date, name, age, gender,
    nameTe: (nameEn && nameTeIn) ? nameTeIn : '',
    address: document.getElementById('fVillage').value,
    contact: document.getElementById('fContact').value.trim(),
    opFee: Number(document.getElementById('fOpFee').value || 0),
    status: document.getElementById('fStatus').value,
    doctor,
    suggestedTreatment:'', fee:'', payments:[], nextVisit:'', notes:'',
    createdAt: Date.now()
  };
  DATA.patients.push(p);
  saveData();
  renderRecentList();
  printEntryForm(p.id);
  document.getElementById('fName').value='';
  document.getElementById('fNameTe').value='';
  document.getElementById('fAge').value='';
  document.getElementById('fContact').value='';
  alert(`Patient saved. ID: ${p.id}`);
}

function printEntryForm(id){
  const p = findPatient(id); if(!p) return;
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  // [value, left(pt), top(pt), width(pt)] — matched to the dotted lines on the Rx paper
  const f = (v,l,t,w)=>`<div class="rx-f" style="left:${l}pt;top:${t}pt;width:${w}pt">${esc(v)}</div>`;
  const area = document.getElementById('printArea');
  area.className = 'rx';
  area.innerHTML = `
    <div class="rx-sheet">
      ${f(p.nameTe ? p.name+' / '+p.nameTe : p.name, 112, 141, 288)}
      ${f(fmtDate(p.date),      468, 141,  85)}
      ${f(p.age+' / '+p.gender, 112, 158, 118)}
      ${f(p.contact||'',        272, 158, 120)}
      ${f(p.id,                 468, 158,  85)}
      ${f(p.address||'',        112, 175, 440)}
    </div>`;
  window.print();
}

/* ---- Admin: Edit patient name & phone ---- */
function hasTelugu(t){ return /[\u0C00-\u0C7F]/.test(t||''); }
function splitNames(p){
  if(p.nameTe) return {en:p.name||'', te:p.nameTe};
  if(hasTelugu(p.name)) return {en:'', te:p.name};
  return {en:p.name||'', te:''};
}
function applyNames(p, en, te){ p.name = en || te; p.nameTe = (en && te) ? te : ''; }
function teName(p){ return p && p.nameTe ? ` <span class="te" style="color:var(--ink-soft,#555);font-size:.95em;">(${escAttr(p.nameTe)})</span>` : ''; }
function escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
RENDERERS.editpatients = function(){
  if(!SESSION || SESSION.role!=='admin'){ document.getElementById('mainArea').innerHTML = '<div class="card"><div class="empty"><b>Admin only</b>You do not have access to this page.</div></div>'; return; }
  document.getElementById('mainArea').innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Admin</div><h2>Edit Patient Details</h2><p>Correct a patient's name or phone number. Patient ID stays the same.</p></div></div>
    <div class="card">
      <div class="toolbar">
        <input type="text" id="epSearch" placeholder="Search by name, phone or Patient ID" oninput="renderEditPatientList()">
      </div>
      <div id="epList"></div>
    </div>`;
  renderEditPatientList();
  const logs = [];
  DATA.patients.forEach(p=>(p.editLog||[]).forEach(e=>logs.push({e,p})));
  logs.sort((a,b)=>new Date(b.e.at)-new Date(a.e.at));
  document.getElementById('mainArea').insertAdjacentHTML('beforeend', `
    <div class="card"><h3>Recent changes</h3>
      ${logs.length ? logs.slice(0,20).map(x=>logRowHtml(x.e,x.p)).join('') : '<div class="field-note">No name or phone changes have been made yet.</div>'}
    </div>`);
};
function renderEditPatientList(){
  const q = (document.getElementById('epSearch').value||'').toLowerCase().trim();
  let list = DATA.patients.filter(p=> !q || String(p.name||'').toLowerCase().includes(q) || String(p.nameTe||'').toLowerCase().includes(q) || String(p.id||'').toLowerCase().includes(q) || String(p.contact||'').toLowerCase().includes(q));
  list = list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,50);
  const el = document.getElementById('epList');
  if(!list.length){ el.innerHTML = `<div class="empty"><b>No matches</b>Try a different name, phone or ID.</div>`; return; }
  el.innerHTML = `<table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Entry date</th><th></th></tr></thead><tbody>
    ${list.map(p=>`<tr>
      <td><span class="id-chip">${escAttr(p.id)}</span></td><td>${escAttr(p.name)}${teName(p)}</td><td>${escAttr(p.contact)||'—'}</td><td>${fmtDate(p.date)}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="openEditPatient('${escAttr(p.id)}')">Edit</button></td>
    </tr>`).join('')}
  </tbody></table>${DATA.patients.length>50?'<div class="field-note" style="margin-top:8px;">Showing the 50 most recent matches — search to narrow down.</div>':''}`;
}
function logRowHtml(e, who){
  const txt = e.changes.map(c=>`${c.field}: <b>${escAttr(c.from)||'(blank)'}</b> → <b>${escAttr(c.to)||'(blank)'}</b>`).join('<br>');
  return `<div class="log-row"><div class="log-when">${new Date(e.at).toLocaleString('en-GB')}<br>by ${escAttr(e.by)}</div><div>${who?`<span class="id-chip">${escAttr(who.id)}</span> `:''}${txt}</div></div>`;
}
function openEditPatient(id){
  if(!SESSION || SESSION.role!=='admin') return;
  const p = findPatient(id); if(!p) return;
  openModal(`
    <div class="modal-head"><h3>Edit details <span class="id-chip">${escAttr(p.id)}</span></h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Name in English *</label><input type="text" id="epName" value="${escAttr(splitNames(p).en)}"></div>
    <div class="field"><label>Name in Telugu * (తెలుగు పేరు)</label><input type="text" id="epNameTe" class="te" lang="te" value="${escAttr(splitNames(p).te)}" placeholder="తెలుగులో పేరు"><div class="field-note">Name is required — English or Telugu (either one is enough, or both).</div></div>
    <div class="field"><label>Phone number</label><input type="text" id="epPhone" value="${escAttr(p.contact)}" placeholder="e.g. 9876543210"><div class="field-note">Leave blank to clear the number. Use at least 10 digits if entering one.</div></div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="saveEditPatient('${escAttr(p.id)}')">Save changes</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    </div>
    <div style="margin-top:18px;"><h3 style="font-size:13.5px;margin-bottom:6px;">Edit history</h3>
      ${(p.editLog&&p.editLog.length) ? p.editLog.slice().reverse().map(e=>logRowHtml(e)).join('') : '<div class="field-note">No changes made yet.</div>'}
    </div>
  `);
}
function saveEditPatient(id){
  if(!SESSION || SESSION.role!=='admin'){ alert('Only admin can edit patient details.'); return; }
  const p = findPatient(id); if(!p) return;
  const nameEn = document.getElementById('epName').value.trim();
  const phone = document.getElementById('epPhone').value.trim();
  const nameTeIn = document.getElementById('epNameTe').value.trim();
  const name = nameEn || nameTeIn;
  const nameTe = (nameEn && nameTeIn) ? nameTeIn : '';
  if(!name){ alert('Please enter the patient name in English or Telugu.'); return; }
  if(phone && phone.replace(/\D/g,'').length < 10){ alert('Phone number looks too short. Enter at least 10 digits, or leave it blank.'); return; }
  const changes = [];
  if(name !== p.name) changes.push({field:'Name', from:p.name||'', to:name});
  if(nameTe !== (p.nameTe||'')) changes.push({field:'Telugu name', from:p.nameTe||'', to:nameTe});
  if(phone !== (p.contact||'')) changes.push({field:'Phone', from:p.contact||'', to:phone});
  if(!changes.length){ closeModal(); return; }
  p.editLog = p.editLog || [];
  p.editLog.push({at:new Date().toISOString(), by:(SESSION.name||'Admin'), changes});
  p.name = name;
  p.nameTe = nameTe;
  p.contact = phone;
  saveData();
  closeModal();
  render();
}

/* ---- Next Visits list (all roles; doctors see only their own patients) ---- */
RENDERERS.nextvisits = function(){
  document.getElementById('mainArea').innerHTML = `
    <div class="page-head"><div><div class="eyebrow">Appointments</div><h2>Next Visits</h2><p>Patients with a next visit date, earliest first.</p></div></div>
    <div class="card">
      <div class="toolbar">
        <select id="nvFilter" onchange="renderNextVisitList()">
          <option value="upcoming">Upcoming (today onwards)</option>
          <option value="today">Today</option>
          <option value="tomorrow">Tomorrow</option>
          <option value="week">Next 7 days</option>
          <option value="overdue">Missed / past date</option>
          <option value="all">All</option>
        </select>
        <input type="text" id="nvSearch" placeholder="Search by name or Patient ID" oninput="renderNextVisitList()">
      </div>
      <div id="nvList"></div>
    </div>`;
  renderNextVisitList();
};
function renderNextVisitList(){
  const el = document.getElementById('nvList'); if(!el) return;
  const f = document.getElementById('nvFilter').value;
  const q = (document.getElementById('nvSearch').value||'').trim().toLowerCase();
  const today = dayStr(0), tm = dayStr(1), wk = dayStr(7);
  let list = DATA.patients.filter(p=>p.nextVisit);
  if(SESSION.role && isDoctorRole(SESSION.role)) list = list.filter(p=>p.doctor===SESSION.role);
  if(f==='upcoming') list = list.filter(p=>p.nextVisit>=today);
  else if(f==='today') list = list.filter(p=>p.nextVisit===today);
  else if(f==='tomorrow') list = list.filter(p=>p.nextVisit===tm);
  else if(f==='week') list = list.filter(p=>p.nextVisit>=today && p.nextVisit<=wk);
  else if(f==='overdue') list = list.filter(p=>p.nextVisit<today);
  if(q) list = list.filter(p=> String(p.name||'').toLowerCase().includes(q) || String(p.nameTe||'').toLowerCase().includes(q) || String(p.id||'').toLowerCase().includes(q));
  list.sort((a,b)=> a.nextVisit.localeCompare(b.nextVisit) || String(a.name).localeCompare(String(b.name)));
  if(!list.length){ el.innerHTML = `<div class="empty"><b>No next visits found</b>Patients with a next visit date will appear here.</div>`; return; }
  const canWa = SESSION.role==='admin' || SESSION.role==='receptionist';
  const tag = d => d===today ? '<span class="pill pill-paid">Today</span>' : d===tm ? '<span class="pill pill-partial">Tomorrow</span>' : d<today ? '<span class="pill pill-unpaid">Missed</span>' : '';
  el.innerHTML = `<div style="font-size:12.5px;color:#666;margin-bottom:8px;">${list.length} patient${list.length>1?'s':''}</div>
    <table><thead><tr><th>Next visit</th><th>ID</th><th>Name</th><th>Contact</th><th>Doctor</th><th>Balance</th>${canWa?'<th></th>':''}</tr></thead><tbody>
    ${list.map(p=>`<tr>
      <td><b>${fmtDate(p.nextVisit)}</b> ${tag(p.nextVisit)}</td>
      <td><span class="id-chip">${p.id}</span></td>
      <td>${p.name}${teName(p)}</td>
      <td>${p.contact||'—'}</td>
      <td>${DATA.users[p.doctor]?DATA.users[p.doctor].name:'—'}</td>
      <td>${p.fee?money(balanceOf(p)):'—'}</td>
      ${canWa?`<td><button class="btn btn-primary btn-sm" onclick="openWaModal('${p.id}','appt')">Send reminder</button></td>`:''}
    </tr>`).join('')}
    </tbody></table>`;
}
function listTable(list, showPrint){
  if(!list.length) return `<div class="empty"><b>Nothing here yet</b>Entries will show up once added.</div>`;
  return `<table><thead><tr><th>ID</th><th>Name</th><th>Age/Gender</th><th>Doctor</th><th>OP Fee</th>${showPrint?'<th></th>':''}</tr></thead><tbody>
    ${list.map(p=>`<tr>
      <td><span class="id-chip">${p.id}</span></td><td>${p.name}${teName(p)}</td><td>${p.age} / ${p.gender}</td>
      <td>${DATA.users[p.doctor]?DATA.users[p.doctor].name:'—'}</td>
      <td>${money(p.opFee)} ${opStatusPill(p.status)}</td>
      ${showPrint?`<td><button class="btn btn-ghost btn-sm" onclick="printEntryForm('${p.id}')">Print</button></td>`:''}
    </tr>`).join('')}
  </tbody></table>`;
}

function openDoctorPanel(id){
  const p = findPatient(id); if(!p) return;
  const treatOpts = ['', ...DATA.treatments].map(t=>`<option value="${t}" ${p.suggestedTreatment===t?'selected':''}>${t||'None selected'}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>${p.name}${teName(p)} <span class="id-chip">${p.id}</span></h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="grid2" style="margin-bottom:14px;">
      <div><div class="field-note">Age / Gender</div><b>${p.age} / ${p.gender}</b></div>
      <div><div class="field-note">Contact</div><b>${p.contact||'—'}</b></div>
      <div><div class="field-note">OP Fee</div><b>${money(p.opFee)} · ${p.status}</b></div>
      <div><div class="field-note">Entry date</div><b>${fmtDate(p.date)}</b></div>
    </div>
    <div class="field"><label>Suggested treatment (optional)</label><select id="mTreat">${treatOpts}</select></div>
    <div class="grid2">
      <div class="field"><label>Treatment fee (optional)</label><input type="number" id="mFee" value="${p.fee||''}" placeholder="Total fee" ${feeIsLocked(p)?'readonly disabled style="background:var(--surface-2);cursor:not-allowed;"':''}>${feeIsLocked(p)?'<div class="field-note">Locked. Only admin can add extra amount.</div>':''}</div>
      <div class="field"><label>Next date of visit (optional)</label><input type="date" id="mNext" value="${p.nextVisit||''}"></div>
    </div>
    <div class="field"><label>Note / comment</label><textarea id="mNote" rows="3" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;">${p.notes||''}</textarea></div>
    <div class="card" style="background:var(--surface-2);box-shadow:none;padding:14px;margin-bottom:14px;">
      <h3 style="margin-bottom:8px;">Installments</h3>
      <div id="installList">${renderInstallments(p)}</div>
      <div class="field-note" style="margin-top:8px;">Balance: <b>${money(balanceOf(p))}</b> of ${money(p.fee||0)}</div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="saveDoctorNotes('${p.id}')">Save</button>
      <button class="btn btn-ghost" onclick="closeModal();openInstallmentModal('${p.id}')">Record payment</button>
    </div>
  `);
}
function renderInstallments(p){
  if(!p.payments || !p.payments.length) return `<div class="field-note">No payments recorded yet.</div>`;
  return p.payments.map((x,i)=>`<div class="installment-row"><span>Installment ${i+1}</span><span>${fmtDate(x.date)}</span><b>${money(x.amount)}</b></div>`).join('');
}
function saveDoctorNotes(id){
  const p = findPatient(id); if(!p) return;
  p.suggestedTreatment = document.getElementById('mTreat').value;
  if(!feeIsLocked(p)){ const f = Number(document.getElementById('mFee').value||0); if(f>0) p.fee = f; }
  p.nextVisit = document.getElementById('mNext').value;
  p.notes = document.getElementById('mNote').value;
  saveData();
  closeModal();
  render();
}

      <td>${p.fee?money(p.fee):'—'}</td><td>${money(paidSoFar(p))}</td>
      <td><b>${money(balanceOf(p))}</b></td>
      <td><button class="btn btn-ghost btn-sm" onclick="openInstallmentModal('${p.id}')">Record payment</button> <button class="btn btn-ghost btn-sm" onclick="openWaModal('${p.id}','paid')">WhatsApp</button></td>
    </tr>`).join('')}
  </tbody></table>`;
}
function feeIsLocked(p){ return Number(p.fee||0) > 0; }
function isAdminUser(){ return !!(SESSION && SESSION.role==='admin'); }
function feeFieldsHtml(p){
  if(!feeIsLocked(p)){
    // New entry: fee not yet set -> anyone can enter it once
    return `<div class="field"><label>Total treatment fee</label><input type="number" id="iTotalFee" value="" placeholder="Enter total fee (one time)"></div>`;
  }
  // Fee already entered -> read-only for doctor & receptionist
  let html = `<div class="field"><label>Total treatment fee</label><input type="number" id="iTotalFee" value="${p.fee}" readonly disabled style="background:var(--surface-2);cursor:not-allowed;"><div class="field-note">Locked. Only admin can add extra amount.</div></div>`;
  if(isAdminUser()){
    html += `<div class="field"><label>Added / extra treatment amount (admin only)</label><input type="number" id="iExtraFee" min="0" placeholder="0"><div class="field-note">This amount will be added to the total treatment fee.</div></div>`;
  }
  return html;
}
function openInstallmentModal(id){
  const p = findPatient(id); if(!p) return;
  openModal(`
    <div class="modal-head"><h3>Record payment — ${p.name}${teName(p)}</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="field-note" style="margin-bottom:12px;">Total fee: <b>${money(p.fee||0)}</b> · Paid so far: <b>${money(paidSoFar(p))}</b> · Balance: <b>${money(balanceOf(p))}</b></div>
    <div class="grid2">
      ${feeFieldsHtml(p)}
      <div class="field"><label>Amount paid now</label><input type="number" id="iAmount" placeholder="0"></div>
      <div class="field"><label>Payment date</label><input type="date" id="iDate" value="${todayStr()}"></div>
      <div class="field"><label>Next visit (optional)</label><input type="date" id="iNext" value="${p.nextVisit||''}"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary" onclick="recordPayment('${p.id}')">Save payment</button>
      <button class="btn btn-ghost" onclick="printBillFor('${p.id}')">Print bill</button>
      <button class="btn btn-ghost" onclick="recordPayment('${p.id}', true)">Save & WhatsApp</button>
    </div>
  `);
}
function recordPayment(id, viaWa){
  const p = findPatient(id); if(!p) return;
  const feeEl = document.getElementById('iTotalFee');
  const extraEl = document.getElementById('iExtraFee');
  const amt = Number(document.getElementById('iAmount').value||0);
  const date = document.getElementById('iDate').value || todayStr();
  const next = document.getElementById('iNext').value;
  if(!feeIsLocked(p)){
    // first-time entry of total fee
    const fee = feeEl ? Number(feeEl.value||0) : 0;
    if(fee>0) p.fee = fee;
  } else if(isAdminUser() && extraEl){
    // only admin can add extra treatment amount
    const extra = Number(extraEl.value||0);
    if(extra>0){
      p.fee = Number(p.fee) + extra;
      p.feeLog = p.feeLog || [];
      p.feeLog.push({at:new Date().toISOString(), by:(SESSION.name||'Admin'), extra});
    }
  }
  if(amt>0){ p.payments = p.payments||[]; p.payments.push({amount:amt, date}); }
  if(next) p.nextVisit = next;
  saveData();
  closeModal();
  if(viaWa){ render(); openWaModal(id, 'paid'); return; }
  printBillFor(id);
  render();
}

/* ---- Admin: Dashboard charts (year-wise + month-wise patient visits) ---- */
let DASH_YEAR = null;
function patientYear(p){ const y = parseInt(String(p.date||'').slice(0,4),10); return isNaN(y)?null:y; }
function barChart(items, max, highlightKey, cls, fmt){
  const top = Math.max(max,1);
  const f = fmt || (v=>v);
  return `<div class="bars">${items.map(it=>`<div class="bar-col"><div class="bar-val">${f(it.value)}</div><div class="bar ${cls||''} ${it.value===0?'zero':''} ${highlightKey!=null && it.key!==highlightKey?'dim':''}" style="height:${Math.max(it.value/top*100,1)}%" title="${it.label}: ${f(it.value)}"></div></div>`).join('')}</div>
  <div class="bar-labels">${items.map(it=>`<span>${it.label}</span>`).join('')}</div>`;
}
function shortMoney(n){ n=Number(n||0); return n>=100000 ? '₹'+(n/100000).toFixed(1)+'L' : n>=1000 ? '₹'+(n/1000).toFixed(1)+'k' : '₹'+n; }
/* Money collected = OP fees marked Paid (on entry date) + every installment (on its payment date) */
function moneyEvents(){
  const ev = [];
  DATA.patients.forEach(p=>{
    if(p.status==='Paid' && Number(p.opFee||0)>0) ev.push({date:p.date, amount:Number(p.opFee)});
    (p.payments||[]).forEach(x=>ev.push({date:x.date, amount:Number(x.amount||0)}));
  });
  return ev;
}
function monthIdx(d){ const m=parseInt(String(d||'').slice(5,7),10)-1; return (m>=0&&m<12)?m:-1; }
function yearOf(d){ const y=parseInt(String(d||'').slice(0,4),10); return isNaN(y)?null:y; }
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function chartStats(){
  const curYear = new Date().getFullYear();
  const pc = {}, mc = {};
  DATA.patients.forEach(p=>{ const y=patientYear(p); if(y) pc[y]=(pc[y]||0)+1; });
  moneyEvents().forEach(e=>{ const y=yearOf(e.date); if(y) mc[y]=(mc[y]||0)+e.amount; });
  pc[curYear]=pc[curYear]||0;
  const years = [...new Set([...Object.keys(pc),...Object.keys(mc)].map(Number))].sort((a,b)=>a-b);
  if(DASH_YEAR===null || !years.includes(DASH_YEAR)) DASH_YEAR = curYear;
  const visitsM = new Array(12).fill(0), moneyM = new Array(12).fill(0);
  DATA.patients.forEach(p=>{ if(patientYear(p)===DASH_YEAR){ const m=monthIdx(p.date); if(m>=0) visitsM[m]++; } });
  moneyEvents().forEach(e=>{ if(yearOf(e.date)===DASH_YEAR){ const m=monthIdx(e.date); if(m>=0) moneyM[m]+=e.amount; } });
  return {years, pc, mc, visitsM, moneyM};
}
function dashChartsHtml(){
  const st = chartStats();
  const yearItems = st.years.map(y=>({key:y,label:String(y),value:st.pc[y]||0}));
  const vItems = MONTHS.map((m,i)=>({key:i,label:m,value:st.visitsM[i]}));
  const mItems = MONTHS.map((m,i)=>({key:i,label:m,value:st.moneyM[i]}));
  const vTotal = st.visitsM.reduce((a,b)=>a+b,0), mTotal = st.moneyM.reduce((a,b)=>a+b,0);
  const bestV = vTotal ? MONTHS[st.visitsM.indexOf(Math.max(...st.visitsM))] : '—';
  const bestM = mTotal ? MONTHS[st.moneyM.indexOf(Math.max(...st.moneyM))] : '—';
  const yearSel = `<select onchange="DASH_YEAR=Number(this.value);render()">${st.years.slice().reverse().map(y=>`<option value="${y}" ${y===DASH_YEAR?'selected':''}>${y}</option>`).join('')}</select>`;
  return `
    <div class="card">
      <div class="chart-head"><h3>Patient visits — year wise</h3>
        <button class="btn btn-xl btn-sm" onclick="downloadYearlyData()">⬇ Download yearly data (Excel)</button></div>
      ${barChart(yearItems, Math.max(...yearItems.map(i=>i.value)), DASH_YEAR, 'blue')}
      <div class="chart-note">Each bar is one calendar year. A new year is added automatically when the year changes.</div>
    </div>
    <div class="chart-head" style="margin-bottom:10px;"><h3>Month wise — ${DASH_YEAR}</h3><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">${yearSel}<button class="btn btn-xl btn-sm" onclick="downloadMonthlyData()">⬇ Download monthly data (Excel)</button></div></div>
    <div class="chart-pair">
      <div class="card">
        <div class="chart-head"><h3>Patient visits per month</h3></div>
        ${barChart(vItems, Math.max(...st.visitsM), null, 'blue')}
        <div class="chart-note">Total: <b>${vTotal}</b> patients · Busiest: <b>${bestV}</b></div>
      </div>
      <div class="card">
        <div class="chart-head"><h3>Money collected per month</h3></div>
        ${barChart(mItems, Math.max(...st.moneyM), null, 'gold', shortMoney)}
        <div class="chart-note">Total: <b>${money(mTotal)}</b> · Best month: <b>${bestM}</b></div>
      </div>
    </div>`;
}
function xlReady(){
  if(typeof XLSX==='undefined'){ alert('Excel library did not load. Check your internet connection and try again.'); return false; }
  return true;
}
function downloadYearlyData(){
  if(!xlReady()) return;
  const st = chartStats();
  const rows = st.years.map(y=>({'Year':y,'Patients':st.pc[y]||0,'Money collected (₹)':st.mc[y]||0}));
  rows.push({'Year':'Total','Patients':rows.reduce((a,r)=>a+r['Patients'],0),'Money collected (₹)':rows.reduce((a,r)=>a+r['Money collected (₹)'],0)});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Yearly');
  XLSX.writeFile(wb, 'SmileWell_yearly_data.xlsx');
}
function downloadMonthlyData(){
  if(!xlReady()) return;
  const st = chartStats();
  const rows = MONTHS.map((m,i)=>({'Month':m+' '+DASH_YEAR,'Patients':st.visitsM[i],'Money collected (₹)':st.moneyM[i]}));
  rows.push({'Month':'Total','Patients':st.visitsM.reduce((a,b)=>a+b,0),'Money collected (₹)':st.moneyM.reduce((a,b)=>a+b,0)});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Monthly '+DASH_YEAR);
  XLSX.writeFile(wb, 'SmileWell_monthly_data_'+DASH_YEAR+'.xlsx');
}

function exportExcel(){
  const wb = XLSX.utils.book_new();
  const patientRows = DATA.patients.map(p=>({
    'Patient ID':p.id, 'Date':p.date, 'Name':p.name, 'Name (Telugu)':p.nameTe||'', 'Age':p.age, 'Gender':p.gender,
    'Address':p.address, 'Contact':p.contact, 'OP Fee':p.opFee, 'OP Status':p.status,
    'Doctor':DATA.users[p.doctor]?DATA.users[p.doctor].name:'', 'Suggested Treatment':p.suggestedTreatment,
    'Treatment Fee':p.fee, 'Paid So Far':paidSoFar(p), 'Balance':balanceOf(p), 'Next Visit':p.nextVisit, 'Notes':p.notes
  }));
  const paymentRows = [];
  DATA.patients.forEach(p=>{
    paymentRows.push({'Patient ID':p.id,'Name':p.name,'Type':'OP Fee','Date':p.date,'Amount':p.opFee,'Status':p.status});
    (p.payments||[]).forEach((x,i)=> paymentRows.push({'Patient ID':p.id,'Name':p.name,'Type':`Installment ${i+1}`,'Date':x.date,'Amount':x.amount,'Status':'Paid'}));
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(patientRows), 'Patients');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(paymentRows), 'Payment History');
  XLSX.writeFile(wb, `clinic-data-${todayStr()}.xlsx`);
}

/* ===================== INIT ===================== */
async function initApp(){
  const btn = document.getElementById('loginSignInBtn');
  const status = document.getElementById('loginSyncStatus');
  if(FB_ON){
    SESSION = null; sessionStorage.removeItem('clinicops_session');
    const hint = document.getElementById('loginHint');
    if(hint) hint.innerHTML = 'Sign in with the password your admin set for this account.';
    const cpb = document.getElementById('chgPwBtn'); if(cpb) cpb.hidden = false;
    if(btn) btn.disabled = true;
    if(status) status.textContent = 'Connecting to Firebase…';
    try{
      await fbAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
      const user = await new Promise(res=>{ const un = fbAuth.onAuthStateChanged(u=>{ un(); res(u); }); });
      if(user){ try{ await fbStart(null); return; }catch(e){ console.warn(e); } }
      if(status) status.textContent = 'Connected to Firebase. Sign in to continue.';
    }catch(e){
      if(status) status.textContent = 'Could not reach Firebase — check the internet connection.';
    }
    if(btn) btn.disabled = false;
    boot();
    return;
  }
  if(SERVER_URL){
    if(btn) btn.disabled = true;
    if(status) status.textContent = 'Connecting to your Google Sheet…';
    await initData();
    if(status){
      status.textContent = SYNC_STATE==='connected' ? 'Connected to Google Sheet.' :
        SYNC_STATE==='offline' ? 'Offline — using the last synced copy on this device.' :
        'Could not reach the Sheet — check the connection or ask Admin.';
    }
  } else {
    if(status) status.textContent = 'Running in local mode. Admin can connect a Google Sheet under Cloud Sync.';
  }
  if(btn) btn.disabled = false;
  boot();
}
window.addEventListener('DOMContentLoaded', initApp);
